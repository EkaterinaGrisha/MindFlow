server {
    listen 80;
    listen [::]:80;
    server_name mindflow-edu.ru www.mindflow-edu.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mindflow-edu.ru www.mindflow-edu.ru;

    ssl_certificate     /etc/letsencrypt/live/mindflow-edu.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mindflow-edu.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/mindflow;
    index index.html;

    access_log /var/log/nginx/mindflow.access.log;
    error_log  /var/log/nginx/mindflow.error.log;

    # /api/ -> Express на 8787
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 25M;
    }

    # SPA fallback (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кеш статики
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
